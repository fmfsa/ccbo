[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccbo"
version = "0.1.0"
description = "Coarsened Causal Bayesian Optimization"
requires-python = ">=3.9"
dependencies = [
    "numpy<2",  # third_party/CEO uses numpy.core.multiarray / np.PINF (removed in 2.x)
    "pandas",
    "scipy",
    "networkx",
    "matplotlib",
    "seaborn",
    "GPy",
    "emukit",
    "torch",
    "botorch",
    "gpytorch",
    "dcor",
    "ananke-causal",
    "causalchamber",
    "statsmodels",     # third_party/CEO (KDE in the CES acquisition)
    "scikit-learn",    # third_party/CEO
    "tqdm",            # third_party/CEO
]

[tool.setuptools.packages.find]
include = ["ccbo*"]

[tool.pytest.ini_options]
testpaths = ["ccbo/tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running validation (GP fits / MC sampling / full RCCBO runs); run with -m slow",
]
