[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccbo"
version = "0.1.0"
description = "Coarsened Causal Bayesian Optimization"
requires-python = ">=3.9"
dependencies = ["numpy<2", "scipy", "pandas", "networkx", "matplotlib"]

[project.optional-dependencies]
static = [
    "GPy==1.13.2", "emukit==0.5.1", "ananke-causal==0.5.0",
    "seaborn", "scikit-learn", "statsmodels", "PyYAML", "tqdm",
    "graphviz", "pygraphviz",
]
mcbo = ["torch==1.13.1", "botorch==0.7.2", "gpytorch==1.9.0", "wandb==0.26.1"]
test = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
include = ["ccbo*"]

[tool.setuptools.package-data]
ccbo = ["cbo/data/**/*.pkl", "cbo/data/**/*.npy", "cbo/data/**/*.mat"]

[tool.pytest.ini_options]
testpaths = ["ccbo/tests", "experiments/tests"]
addopts = "-m 'not slow'"
markers = ["slow: additional GP-fitting and Monte Carlo regression checks"]
